[workspace]
resolver = "2"
members = [
    "crates/companion-core",
    "crates/companion-storage",
    "crates/companion-models",
    "crates/companion-agent",
    "crates/companion-inference",
    "crates/companion-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
companion-core = { path = "crates/companion-core" }
companion-storage = { path = "crates/companion-storage" }
companion-models = { path = "crates/companion-models" }
companion-agent = { path = "crates/companion-agent" }
companion-inference = { path = "crates/companion-inference" }

relm4 = { version = "0.9", features = ["libadwaita"] }
gtk = { package = "gtk4", version = "0.9", features = ["v4_16"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_6"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
anyhow = "1"
encoding_rs = "0.8"
futures-util = "0.3"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
llama-cpp-2 = { version = "0.1", features = ["vulkan", "mtmd"] }
pdf-extract = "0.7"
pulldown-cmark = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
too_many_arguments = "warn"
cognitive_complexity = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
