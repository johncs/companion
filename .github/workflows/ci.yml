name: CI

on:
  push:
  pull_request:

jobs:
  ci-check:
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest
    steps:
      - name: Install native dependencies
        run: |
          dnf install -y \
            git \
            gtk4-devel \
            libadwaita-devel \
            sqlite-devel \
            cmake \
            gcc-c++ \
            clang \
            glslc \
            glslang \
            spirv-headers-devel \
            vulkan-headers \
            vulkan-loader-devel \
            pkgconf-pkg-config \
            gettext \
            desktop-file-utils \
            appstream \
            python3 \
            findutils \
            gawk \
            grep

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run CI checks
        run: ./scripts/ci-check.sh
